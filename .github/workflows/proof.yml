name: Proof

# Holds every pull request to the QA rule (qa/README.md): a QA run that covers its head commit,
# and recorded stills, plus a walkthrough video where the surface has behaviour, for every surface
# it changes. Re-runs when the description changes, because that is where `pnpm share` puts them.
#
# pull_request_target runs main's copy of this workflow and of the gate, so a pull request cannot
# loosen the check it is held to. Its commits are only read with git, never checked out or run.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  proof:
    name: Proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A pull request only enters the queue with this check passed on it.
      - if: github.event_name == 'merge_group'
        run: echo "Checked on the pull request before it entered the merge queue."
      - if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: github.event_name == 'pull_request_target'
        name: Fetch the pull request's commits
        env:
          PR: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/pull/${PR}"
      - if: github.event_name == 'pull_request_target'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - if: github.event_name == 'pull_request_target'
        name: QA gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node qa/scripts/gate.ts --ci
