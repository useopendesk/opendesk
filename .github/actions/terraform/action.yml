name: Terraform production
description: >-
  Plans deploy/terraform/environments/production with the settings from the state
  bucket and, when asked, applies that plan. Only addresses and actions are
  printed (scripts/tfplan.sh); the plan, its values and Terraform's normal output
  never reach the log. Cloudflare and PlanetScale credentials come from the
  calling step's env (CLOUDFLARE_API_TOKEN, PLANETSCALE_SERVICE_TOKEN_ID,
  PLANETSCALE_SERVICE_TOKEN).

inputs:
  terraform-version:
    description: Terraform version
    required: true
  role-to-assume:
    description: AWS role (AWS_TERRAFORM_ROLE_ARN of the job's environment)
    required: true
  aws-region:
    description: AWS region of the state bucket and the stack
    required: true
  state-bucket:
    description: State bucket (TF_STATE_BUCKET), which also holds the settings
    required: true
  lock:
    description: >-
      "true" takes the state lock. The plan role writes nothing, so its plans
      run with "false".
    default: "false"
  apply:
    description: '"true" applies the plan, after checking it against expected-class and expected-digest'
    default: "false"
  expected-class:
    description: The risk class the applying job is for (safe or risky)
    default: ""
  expected-digest:
    description: The digest of the plan that was summarized for this run
    default: ""

outputs:
  class:
    description: none, safe or risky (scripts/tfplan.sh)
    value: ${{ steps.summary.outputs.class }}
  changes:
    description: '"true" when there is something to apply'
    value: ${{ steps.summary.outputs.changes }}
  risky:
    description: '"true" when an apply needs a reviewer'
    value: ${{ steps.summary.outputs.risky }}
  digest:
    description: sha256 of the planned addresses and actions
    value: ${{ steps.summary.outputs.digest }}
  summary-file:
    description: The markdown summary
    value: ${{ steps.summary.outputs.file }}

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}

    - name: Settings and init
      shell: bash
      working-directory: deploy/terraform/environments/production
      env:
        BUCKET: ${{ inputs.state-bucket }}
        REGION: ${{ inputs.aws-region }}
        TF_IN_AUTOMATION: "true"
      run: |
        umask 077
        aws s3 cp "s3://$BUCKET/opendesk/production.tfvars" terraform.tfvars --only-show-errors
        terraform init -input=false -no-color -lockfile=readonly \
          -backend-config="bucket=$BUCKET" -backend-config="region=$REGION" >/dev/null

    # stdout carries the plan, values included: it goes nowhere. Errors are on stderr.
    - name: Plan
      shell: bash
      working-directory: deploy/terraform/environments/production
      env:
        LOCK: ${{ inputs.lock }}
        TF_IN_AUTOMATION: "true"
      run: |
        if [ "$LOCK" = true ]; then lock=(-lock-timeout=10m); else lock=(-lock=false); fi
        terraform plan -input=false -no-color "${lock[@]}" -out="$RUNNER_TEMP/tfplan" >/dev/null ||
          { echo "::error::terraform plan failed"; exit 1; }

    - name: Summary
      id: summary
      shell: bash
      working-directory: deploy/terraform/environments/production
      run: |
        tfplan="$GITHUB_WORKSPACE/scripts/tfplan.sh"
        actions="$RUNNER_TEMP/tfplan-actions.json"
        file="$RUNNER_TEMP/tfplan.md"
        terraform show -json -no-color "$RUNNER_TEMP/tfplan" | "$tfplan" reduce >"$actions"
        class=$("$tfplan" class <"$actions")
        "$tfplan" markdown <"$actions" >"$file"
        cat "$file" >>"$GITHUB_STEP_SUMMARY"
        {
          echo "class=$class"
          echo "changes=$([ "$class" != none ] && echo true || echo false)"
          echo "risky=$([ "$class" = risky ] && echo true || echo false)"
          echo "digest=$("$tfplan" digest <"$actions")"
          echo "file=$file"
        } >>"$GITHUB_OUTPUT"
        echo "plan: $class"

    # The plan applied is the one this job just made. It must be the plan the run
    # summarized and gated on, so an automatic apply never carries a deletion
    # or a replacement nobody approved.
    - name: Check the plan
      if: inputs.apply == 'true'
      shell: bash
      env:
        CLASS: ${{ steps.summary.outputs.class }}
        DIGEST: ${{ steps.summary.outputs.digest }}
        WANT_CLASS: ${{ inputs.expected-class }}
        WANT_DIGEST: ${{ inputs.expected-digest }}
      run: |
        if [ -z "$WANT_CLASS" ] || [ "$CLASS" != "$WANT_CLASS" ]; then
          echo "::error::This job applies $WANT_CLASS plans; the plan is $CLASS. Run Deploy again."
          exit 1
        fi
        if [ -z "$WANT_DIGEST" ] || [ "$DIGEST" != "$WANT_DIGEST" ]; then
          echo "::error::The plan differs from the one summarized in this run. Run Deploy again."
          exit 1
        fi

    # Apply prints values too: stdout goes nowhere, Terraform's errors stay on stderr.
    - name: Apply
      if: inputs.apply == 'true'
      shell: bash
      working-directory: deploy/terraform/environments/production
      env:
        TF_IN_AUTOMATION: "true"
      run: |
        terraform apply -input=false -no-color -lock-timeout=10m "$RUNNER_TEMP/tfplan" >/dev/null ||
          { echo "::error::terraform apply failed"; exit 1; }
        echo "applied"

    - name: Clean up
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP/tfplan" deploy/terraform/environments/production/terraform.tfvars
