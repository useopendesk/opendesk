<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'" />
    <meta name="color-scheme" content="light dark" />
    <title>opendesk</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="picker.css" />
  </head>
  <body data-page="picker">
    <div class="drag" aria-hidden="true"></div>
    <main class="shell">
      <form id="form" class="panel" novalidate>
        <header class="head">
          <span class="mark" aria-hidden="true"></span>
          <h1 id="title">Connect to opendesk</h1>
          <p class="sub">Choose where your team's opendesk lives. You can switch any time from the menu.</p>
        </header>

        <div class="options" role="radiogroup" aria-labelledby="title">
          <label class="option" data-value="cloud">
            <input type="radio" name="kind" value="cloud" checked />
            <span class="glyph" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" /></svg>
            </span>
            <span class="text">
              <span class="name">opendesk Cloud</span>
              <span class="detail mono">app.opendesk.sh</span>
            </span>
            <span class="dot" aria-hidden="true"></span>
          </label>

          <label class="option" data-value="own">
            <input type="radio" name="kind" value="own" />
            <span class="glyph" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2" /><rect x="3" y="13" width="18" height="7" rx="2" /><path d="M7 7.5h.01M7 16.5h.01" /></svg>
            </span>
            <span class="text">
              <span class="name">Your own server</span>
              <span class="detail">A self-hosted opendesk</span>
            </span>
            <span class="dot" aria-hidden="true"></span>
          </label>

          <div class="address" id="address-wrap" hidden>
            <label for="address">Server address</label>
            <input id="address" name="address" type="text" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false" placeholder="support.example.com" />
            <p class="hint">The address you open opendesk at in your browser.</p>
          </div>
        </div>

        <div id="error" class="notice" role="alert" hidden></div>

        <div class="actions">
          <button type="button" id="cancel" class="button secondary" hidden>Cancel</button>
          <button type="submit" id="continue" class="button primary">
            <span class="spinner" aria-hidden="true"></span>
            <span class="label">Continue</span>
          </button>
        </div>
      </form>
    </main>
    <script src="picker.js"></script>
  </body>
</html>
